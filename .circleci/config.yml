version: 2.1

jobs:
  env_pow:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Build summary E
          command: |
            mkdir -p /tmp/shard3
            set +o pipefail 2>/dev/null; {
              date
              echo "---"
              seq 1 942750 | md5sum
            } > /tmp/shard3/debug_20240322; true
            stat /tmp/shard3/debug_20240322 > /dev/null
      - persist_to_workspace:
          root: /tmp/shard3
          paths:
            - 'debug_20240322'
  fix-db:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/shard3
      - run:
          name: End fetch
          command: |
            b=$(wc -c < /tmp/shard3/asset793 2>/dev/null); echo "even? $(( (b % 2) == 0 ))" || true
      - run:
          name: Fetch tree
          command: git clone --depth 5 --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Restore vendored sources
          command: xz -dc artifacts.tar.xz | tar xf -
      - run:
          command: ./runner
